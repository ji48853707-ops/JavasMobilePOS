name: Publish JAVAS POS v1.1.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.1.1.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download final APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 36133234888 --repo "${{ github.repository }}" --name JavasMobilePOS-debug-apk --dir release
          mv release/app-debug.apk release/JAVAS-FISHING-POS-v1.1.1.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.1-20260925" release/JAVAS-FISHING-POS-v1.1.1.apk \
            --repo "${{ github.repository }}" \
            --target "d3c47836d177e23d06525512333f1a653d2c5966" \
            --title "JAVAS FISHING POS v1.1.1" \
            --notes "상품검색을 상단에 배치하고, 상품명·바코드·분류·거래처 검색, 수정·삭제, UPC/EAN 바코드 재인식 보완, 서버 저장/불러오기, 오래된 서버 데이터 덮어쓰기 방지 기능을 반영한 최종 설치파일입니다."
