name: Publish JAVAS POS v1.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.1.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download final APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download 36132530937 --repo "${{ github.repository }}" --name JavasMobilePOS-debug-apk --dir release
          mv release/app-debug.apk release/JAVAS-FISHING-POS-v1.1.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.0-20260925" release/JAVAS-FISHING-POS-v1.1.apk \
            --repo "${{ github.repository }}" \
            --target "5548b165b3f38cc0a1337acee15013cdd6a3c1b1" \
            --title "JAVAS FISHING POS v1.1" \
            --notes "상품검색, 수정/삭제, 바코드 재인식 보완, 서버 저장/불러오기, 데이터 덮어쓰기 보호를 반영한 v1.1 설치파일입니다."
